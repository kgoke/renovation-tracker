name: Build Android APK

on:
  push:
    branches:
      - main
      - claude/house-restoration-android-app-8dpthp
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Probe expo autolinking mirror command
        working-directory: android
        run: |
          node --version
          set +e
          node --no-warnings --eval "require('expo/bin/autolinking')" expo-modules-autolinking \
            mirror-kotlin-inline-modules \
            --kotlin-files-mirror-directory "$GITHUB_WORKSPACE/node_modules/expo/android/src/main/java/inline/modules" \
            --inline-modules-list-directory "$GITHUB_WORKSPACE/node_modules/expo/android/build/inline/modules" \
            --watched-directories-serialized "[]"
          echo "probe exit code: $?"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          # Give Gradle more headroom than the template default (last key wins).
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> android/gradle.properties
          cd android
          ./gradlew assembleRelease --stacktrace

      - name: Collect APK
        run: cp android/app/build/outputs/apk/release/app-release.apk renovation-tracker.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: renovation-tracker-apk
          path: renovation-tracker.apk

      - name: Publish rolling release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Android build
          body: |
            Debug-signed APK for sideloading, built from `${{ github.ref_name }}` @ ${{ github.sha }}.

            **Install:** download `renovation-tracker.apk` on your Android phone, open it,
            and allow installing from your browser when prompted.
          files: renovation-tracker.apk
          make_latest: true
